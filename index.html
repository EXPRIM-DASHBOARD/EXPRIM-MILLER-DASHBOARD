<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXPRIM</title>
<link rel="manifest" href="exprim.webmanifest">
<meta name="theme-color" content="#0E1B2E">
<link rel="apple-touch-icon" href="exprim-icon-192.png">
<style>
:root{--bg:#0E1B2E;--card:#152540;--line:#24344E;--gold:#D4AF37;--ink:#E8EDF5;--ink2:#8FA1BC;--verde:#82C45A;--cream:#1D2E4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;z-index:0;
 background:radial-gradient(circle at 50% 26%, rgba(130,196,90,.16), transparent 55%)}
.box{width:100%;max-width:380px;text-align:center;position:relative;z-index:2}
.logo{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:block;
 box-shadow:0 0 0 3px rgba(130,196,90,.35), 0 8px 30px rgba(0,0,0,.45)}
h1{font-size:20px;font-weight:800;color:var(--gold);letter-spacing:.14em;margin-bottom:6px}
.sub{font-size:12.5px;color:var(--ink2);margin-bottom:26px}
a.card{display:block;background:rgba(21,37,64,.88);border:1.5px solid var(--line);border-radius:14px;
 padding:22px 18px;margin:12px 0;text-decoration:none;color:var(--ink);transition:border-color .15s}
a.card:hover{border-color:var(--verde)}
a.card b{display:block;font-size:17px;letter-spacing:.1em;margin-bottom:5px}
a.card span{font-size:12px;color:var(--ink2)}
.note{font-size:11px;color:var(--ink2);margin-top:18px}
</style></head><body>
