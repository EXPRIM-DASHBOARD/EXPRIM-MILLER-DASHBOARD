<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D2A3F"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="ELO">
<title>EXPRIM PRODUÇÃO · ELO — teste</title>
<style>
:root{
  --paper:#F3EFE6; --card:#FBF9F4; --ink:#1C1A17; --ink2:#5B554B; --line:#DDD5C6;
  --indigo:#1D2A3F; --indigo2:#2C3D5A; --brass:#B8862B; --brass-l:#E0A83C;
  --green:#2F6B4F; --red:#B3352E; --amber:#A3641A;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;cursor:pointer}
.mc{font:700 11.5px var(--mono);letter-spacing:.03em}
.mc small{font:700 9px var(--mono);color:var(--brass);margin-left:5px;letter-spacing:.1em}
.mc.big{font-size:14px}
.sm{font-size:11.5px;color:var(--ink2)}
.empty{color:var(--ink2);font-size:12px;padding:10px 4px}
.empty.big{font-size:15px;text-align:center;padding:80px 20px;line-height:1.8}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--indigo);color:#EEF1F6;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .brand{display:flex;flex-direction:column;line-height:1.1}
header.top .brand b{font:800 15px var(--sans);letter-spacing:.12em}
header.top .brand b em{font-style:normal;color:var(--brass-l)}
header.top .brand span{font:600 9.5px var(--mono);letter-spacing:.18em;opacity:.7;margin-top:3px}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;color:#C9D2E2;padding:6px 14px;border-radius:7px;font:700 11px var(--mono);letter-spacing:.12em}
.tab.on{background:var(--card);color:var(--indigo)}
.search{flex:1;min-width:160px;max-width:340px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:7px 11px;font:13px var(--sans)}
.search::placeholder{color:#8F9BB3}
.btn{border:1px solid var(--brass);background:var(--brass);color:#1C1A17;border-radius:8px;padding:7px 12px;font:700 11px var(--mono);letter-spacing:.08em}
#snap{font:700 11px var(--mono);color:var(--brass-l);letter-spacing:.04em}#snap:empty{display:none}
.btn.exp{background:transparent;color:#F3E7C8;border-color:rgba(255,255,255,.35)}
main{overflow-x:auto}
@media(max-width:640px){header.top{padding:8px 10px;gap:8px}.tab{padding:6px 9px;font-size:10px}.search{min-width:120px}.chips{padding:8px 10px;gap:6px}.chip .hint{display:none}main{padding:10px}.mph{padding:14px 14px 10px}.mpc{padding:12px 14px 16px}#mp{padding:8px}.kpis{grid-template-columns:1fr 1fr}.pl-head,.pl-row{grid-template-columns:24px 34px 1fr 60px}.pl-c,.pl-m,.pl-open{display:none}}
#ref{width:100%;font:500 11px var(--mono);opacity:.75;letter-spacing:.02em}
#ref b{color:var(--brass-l);opacity:1}

/* chips */
.chips{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px 5px 8px;display:flex;align-items:center;gap:8px;font:600 11.5px var(--sans)}
.chip b{font:800 12px var(--mono);min-width:22px;text-align:center;border-radius:11px;padding:1px 6px;background:var(--paper)}
.chip.atu b{background:#F6E6C3;color:var(--amber)} .chip.ver b{background:#F4D6D3;color:var(--red)} .chip.fila b{background:#DCE5F3;color:var(--indigo)} .chip.ficha b{background:#E6E2DA;color:var(--ink2)}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.chip .hint{font-size:10.5px;color:var(--ink2)} .chip.on .hint{color:#C9D2E2}

main{padding:14px 16px 60px}

/* lanes */
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.lane{background:rgba(29,42,63,.05);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.lane header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px}
.lane header b{font:800 11px var(--mono);letter-spacing:.14em;color:var(--indigo)} .lane header span{font:600 10px var(--mono);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card:hover{border-color:var(--brass)}
.card .c1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .nm{font:600 12.5px var(--sans);margin:3px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c3{display:flex;align-items:center;gap:8px}
.pg{flex:1;height:4px;background:#E6E0D3;border-radius:2px;overflow:hidden}.pg i{display:block;height:100%;background:var(--indigo2)}
.pz{font:600 10px var(--mono);color:var(--ink2);white-space:nowrap}.pz.late,.late{color:var(--red)}
.card .sub{margin-top:6px;font:700 9.5px var(--mono);letter-spacing:.08em;color:var(--ink2)}.card .sub.on{color:var(--green)}
.lots{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.lt{font:600 10.5px var(--mono);color:var(--indigo2);display:block}.lt.ok{color:var(--green)}.lt.warn{color:var(--amber)}.lt.late{color:var(--red)}
.bd{font:800 9px var(--mono);letter-spacing:.1em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.bd.atualizar{background:#F6E6C3;color:var(--amber)}.bd.verificar{background:#F4D6D3;color:var(--red)}.bd.semcodigo{background:#E6E2DA;color:var(--ink2)}

/* rail */
.rail{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.rail i{width:9px;height:9px;border-radius:50%;background:#DDD5C6;display:inline-block}
.rail i.d{background:var(--green)}.rail i.a{background:var(--brass);box-shadow:0 0 0 2px rgba(184,134,43,.25)}

/* roberto */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi.hi{border-color:var(--indigo);background:#fff}.kpi.warn{border-color:var(--red)}
.kpi b{font:800 10px var(--mono);letter-spacing:.14em;color:var(--ink2)}
.kpi em{font:800 30px/1 var(--sans);font-style:normal;color:var(--indigo)}
.kpi span{font-size:11.5px;color:var(--ink2)}.kpi small{font:700 10px var(--mono);color:var(--green)}.kpi small.late{color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px 10px}
.panel h3{font:800 10.5px var(--mono);letter-spacing:.14em;color:var(--indigo);margin:12px 0 6px;display:flex;justify-content:space-between}.panel h3 span{color:var(--ink2)}.panel h3.warn{color:var(--red)}
.frow{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;padding:6px 6px;border-top:1px solid var(--line);cursor:pointer}
.frow:hover{background:#fff}.frow .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frow .sm{grid-column:2}

/* fila por tecido */
.ptog{display:flex;justify-content:space-between;align-items:center;gap:8px}.ptog h3{flex:1}
.tg{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;font:700 10px var(--mono);letter-spacing:.08em;color:var(--ink2)}.tg.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.panel .hint{font-size:11.5px;color:var(--green);padding:4px 6px 8px}
.fg{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;background:#fff}
.fg.dup{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.fgh{display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;padding:7px 9px;background:rgba(29,42,63,.05);cursor:pointer}
.fgh img{width:38px;height:38px;object-fit:cover;border-radius:5px}.fgh .noth{width:38px;height:38px;border-radius:5px;background:#EAE4D8;display:block}
.fgh b{display:block;font:700 12px var(--sans)}.fgh span{font:600 10.5px var(--mono);color:var(--ink2)}.fgh em{font-style:normal;color:var(--green);font-weight:800}
.fgh .cnt{font:800 16px var(--sans);color:var(--indigo);display:flex;align-items:baseline;gap:3px}.fgh .cnt small{font:700 9px var(--mono);color:var(--ink2)}.fgh .cnt i{font:700 11px var(--mono);color:var(--ink2);font-style:normal}
.fg .frow{border-top:1px solid var(--line)}.fg .frow.ok .nm{font-weight:600}.okt{color:var(--green);font:800 10px var(--mono)}
/* mesmo tecido */
.card .same{margin-top:5px;font:800 9.5px var(--mono);letter-spacing:.06em;color:var(--green);background:#E7F1EB;border:1px solid #BFD8C9;border-radius:5px;padding:3px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .same:hover{background:#D9EAE0}
.fup{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 9px;border-top:1px dashed var(--line);background:#FBF9F4}
.fup b{font:800 9px var(--mono);letter-spacing:.14em;color:var(--ink2);margin-right:2px}
.fup span{font:700 10.5px var(--mono);color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer}
.fup span i{font-style:normal;font-weight:500;color:var(--ink2)}.fup span:hover{border-color:var(--brass)}
/* plano de corte */
.pl{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:800px){.pl{grid-template-columns:1fr}}
.pl-list{display:flex;flex-direction:column;gap:6px}
.pl-it{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px}
.pl-it.on{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo);background:#fff}
.pl-it img,.pl-it .noth{width:40px;height:40px;object-fit:cover;border-radius:5px;background:#EAE4D8;display:block}
.pl-it b{display:block;font:700 12px var(--sans)}.pl-it small{font:600 10px var(--mono);color:var(--ink2)}
.pl section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.pl-h{display:flex;gap:14px;align-items:center;margin-bottom:12px}.pl-h img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer}.pl-h .noth.big{width:72px;height:72px;border-radius:8px;background:#EAE4D8;display:block}
.pl-h h2{margin:0 0 4px;font:700 18px var(--sans)}
.pl-rows{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.pl-head,.pl-row{display:grid;grid-template-columns:28px 40px 1fr 80px 170px 80px 54px;gap:10px;align-items:center;padding:8px 10px}
.pl-head{font:800 9px var(--mono);letter-spacing:.14em;color:var(--ink2);background:rgba(29,42,63,.05)}
.pl-row{border-top:1px solid var(--line);cursor:pointer}.pl-row.on{background:#F7FBF8}.pl-row.up{opacity:.75}.pl-row:hover{background:#F4F1EA}
.pl-row img,.pl-row .noth{width:40px;height:50px;object-fit:cover;border-radius:4px;background:#EAE4D8;display:block}
.pl-nm{display:flex;flex-direction:column;min-width:0;font-size:12.5px}.pl-nm b{margin-bottom:1px}.pl-nm i{font-style:normal;font:600 10px var(--mono);color:var(--ink2)}
.pl-q,.pl-c,.pl-m{display:flex;flex-direction:column;line-height:1.15}.pl-q b,.pl-m b,.pl-c b{font:800 14px var(--sans);color:var(--indigo)}.pl-q small,.pl-m small,.pl-c small{font:600 9.5px var(--mono);color:var(--ink2)}
.pl-open{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 6px;font:700 9.5px var(--mono)}
.pl-tot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--indigo);color:#fff}
.pl-tot>div{display:flex;flex-direction:column}.pl-tot b{font:800 20px/1 var(--sans)}.pl-tot small{font:600 9.5px var(--mono);opacity:.75;margin-top:2px}.pl-tot .late b{color:#FFB3AD}.pl-tot .btn{margin-left:auto}
/* oficinas + checklist */
h3.sec{font:800 10.5px var(--mono);letter-spacing:.16em;color:var(--indigo);margin:18px 0 8px}
.ofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ofc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px}
.ofc.late{border-color:#E3B6B2}
.ofh{display:flex;align-items:baseline;gap:8px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;flex-wrap:wrap}
.ofh b{font:800 12px var(--mono);letter-spacing:.08em;color:var(--indigo)}.ofh span{font:600 10.5px var(--mono);color:var(--ink2)}.ofh em{margin-left:auto;font:800 10px var(--mono);color:var(--red);font-style:normal}.ofh em.ok{color:var(--green)}
.ofl{display:grid;grid-template-columns:30px 1fr;gap:1px 8px;padding:5px 2px;border-top:1px solid #EEE9DF;cursor:pointer;align-items:center}
.ofl:first-of-type{border-top:0}.ofl:hover{background:#fff}
.ofl img,.ofl .noth{width:30px;height:38px;object-fit:cover;border-radius:4px;background:#EAE4D8;grid-row:1/4;display:block}
.ofl .nm{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.ofl .dt{font:600 10px var(--mono);color:var(--ink2)}.ofl .dt.late,.ofl .dt.late b{color:var(--red)}
.todo .bar{height:5px;background:#E6E0D3;border-radius:3px;overflow:hidden;margin:2px 0 8px}.todo .bar i{display:block;height:100%;background:var(--green)}
.tg-h{font:800 9.5px var(--mono);letter-spacing:.14em;color:var(--ink2);margin:10px 0 3px;display:flex;justify-content:space-between}
.ti{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:5px 4px;border-top:1px solid #EEE9DF;font-size:12.5px;cursor:pointer}
.ti.d span{text-decoration:line-through;color:var(--ink2)}.ti button{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:2px 6px;font:700 9.5px var(--mono)}
.tadd{display:flex;gap:6px;margin-top:10px}.tadd input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:12.5px var(--sans);background:#fff}
/* velocidade */
.vel{margin-top:14px;overflow-x:auto}
.vt{width:100%;border-collapse:collapse;font-size:11.5px}
.vt th{font:800 9px var(--mono);letter-spacing:.12em;color:var(--ink2);text-align:center;padding:4px 4px;border-bottom:1px solid var(--line)}
.vt th:first-child{text-align:left}
.vt td{padding:3px 4px;border-bottom:1px solid #EEE9DF;text-align:center;vertical-align:bottom}
.vt td.on{text-align:left;font:700 11px var(--mono);white-space:nowrap}
.vt td.c{height:40px;position:relative}
.vt td.c i{display:block;margin:0 auto;width:70%;max-width:34px;background:var(--indigo2);border-radius:2px 2px 0 0;opacity:.85}
.vt td.c span{display:block;font:600 9.5px var(--mono);color:var(--ink2);line-height:1.2;min-height:12px}
.vt td.mc{font:700 11px var(--mono);white-space:nowrap}.vt td small{font:600 9px var(--mono);color:var(--ink2)}
/* velocidade: tags */
.vt tr.best td{background:#EEF6F0}
.vt .tag{display:inline-block;margin-left:6px;font:800 8.5px var(--mono);letter-spacing:.08em;padding:1px 5px;border-radius:4px;font-style:normal;background:var(--green);color:#fff;vertical-align:middle}
.vt .tag.f{background:#DCE5F3;color:var(--indigo)}.vt .tag.c{background:#F6E6C3;color:var(--amber)}
/* lista */
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{text-align:left;font:800 9.5px var(--mono);letter-spacing:.14em;color:var(--ink2);padding:6px 8px;border-bottom:2px solid var(--line)}
.tb td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tb tr{cursor:pointer}.tb tr:hover td{background:#fff}
.tb td small{color:var(--ink2);font-size:10.5px}

/* model page */
#mp{position:fixed;inset:0;background:rgba(10,15,26,.55);display:none;z-index:50;padding:20px}
#mp.on{display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.mpw{background:var(--paper);border-radius:14px;max-width:1080px;width:100%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#mpClose{position:absolute;right:14px;top:12px;border:0;background:var(--indigo);color:#fff;border-radius:8px;padding:7px 12px;font:700 11px var(--mono)}
.mph{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mph h2{margin:4px 0;font:700 20px var(--sans)}
.elo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:90px}.elo b{font:700 12px var(--mono);letter-spacing:.04em;color:var(--indigo)}
.mpc{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 22px 22px}
@media(max-width:760px){.mpc{grid-template-columns:1fr}}
.mpc h4{font:800 10px var(--mono);letter-spacing:.14em;color:var(--ink2);margin:6px 0 10px}
.fz>b{display:block;font:800 10px var(--mono);letter-spacing:.12em;color:var(--indigo)}
.it{display:grid;grid-template-columns:14px 1fr 70px 48px;gap:6px;align-items:baseline;padding:5px 4px;font-size:12px;color:var(--ink2);border-bottom:1px solid #E9E3D6}
.it:last-child{border-bottom:0}
.it:nth-child(even){background:rgba(29,42,63,.025)}
.fz{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 6px 2px;margin-bottom:8px}
.fz>b{padding:6px 4px 4px;border-bottom:1px solid var(--line);margin:0 -6px 2px;padding-left:10px;background:rgba(29,42,63,.05);border-radius:8px 8px 0 0}
.it i{width:9px;height:9px;border-radius:50%;background:#DDD5C6;display:inline-block;position:relative;top:1px}
.it.d{color:var(--ink)}.it.d i{background:var(--green)}.it.a{color:var(--ink);font-weight:600}.it.a i{background:var(--brass);box-shadow:0 0 0 2px rgba(184,134,43,.25)}
.it .rs{font:600 10px var(--mono);text-transform:lowercase}.it .dt{font:600 10px var(--mono);text-align:right}.it .ob{grid-column:2/-1;font-size:11px;color:var(--ink2)}
.lot{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.tl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.tl span{font:600 11px var(--mono);color:var(--ink2);border-top:3px solid #DDD5C6;padding-top:4px}.tl span.d{border-color:var(--green);color:var(--ink)}.tl span.late{border-color:var(--red);color:var(--red)}
.tl span b{display:block;font:800 9px var(--mono);letter-spacing:.14em;margin-bottom:2px}
.lnk{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 10px;margin-bottom:4px;font:600 11px var(--mono)}

/* fotos */
.card.hasph{display:grid;grid-template-columns:44px 1fr;gap:0 9px}
.card .th{width:44px;height:56px;object-fit:cover;border-radius:5px;grid-row:1/5;align-self:start;border:1px solid var(--line)}
.card.hasph>*:not(.th){grid-column:2}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fotos figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fotos img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#EAE4D8}
.fotos .noph{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font:600 11px var(--mono);color:var(--ink2);background:repeating-linear-gradient(45deg,#EFEAE0 0 8px,#F6F2EA 8px 16px)}

function anyISO(g,a){ const n=g.num(a); const s=serialISO(n); if(s) return s; const t=g.txt(a).replace(/\/{2,}/g,'/'); const dm=/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/.exec(t); if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3]; return y+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[1]).padStart(2,'0');} return null; }
function relMap(xml){ const m={}; const re=/<Relationship\b([^>]*?)\/?>/g; let x; while((x=re.exec(xml))){const a=x[1]; const id=(/\bId="([^"]+)"/.exec(a)||[])[1]; const tg=(/\bTarget="([^"]+)"/.exec(a)||[])[1]; if(id&&tg) m[id]=tg;} return m; }
function normPath(base,target){ if(target.startsWith('/')) return target.slice(1); const parts=base.split('/').slice(0,-1); for(const p of target.split('/')){ if(p==='..') parts.pop(); else if(p!=='.') parts.push(p);} return parts.join('/'); }
async function openBook(zip){
  const readT=async p=>{const f=zip.file(p); return f?await f.async('string'):null;};
  const wbXml=await readT('xl/workbook.xml'); if(!wbXml) throw new Error('não é um .xlsx válido');
  const wbRels=relMap(await readT('xl/_rels/workbook.xml.rels')||'');
  const SST=[]; const sstXml=await readT('xl/sharedStrings.xml');
  if(sstXml){const re=/<si>([\s\S]*?)<\/si>/g; let m; while((m=re.exec(sstXml))) SST.push((m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(x=>xmlUnesc(x.replace(/<[^>]+>/g,''))).join(''));}
  const sheets={}; const order=[]; const sre=/<sheet\b([^>]*?)\/>/g; let sm;
  while((sm=sre.exec(wbXml))){ const a=sm[1]; const nm=(/\bname="([^"]+)"/.exec(a)||[])[1]; const rid=(/\br:id="([^"]+)"/.exec(a)||[])[1]; const tgt=wbRels[rid]; if(nm&&tgt){ sheets[xmlUnesc(nm)]=normPath('xl/workbook.xml',tgt); order.push(xmlUnesc(nm)); } }
  /* foto: 1ª imagem ancorada na faixa de colunas pedida */
  const photoOf=async(name,colMin,colMax,rowMax,strict)=>{
    try{
      const p=sheets[name]; if(!p) return null;
      const shRels=relMap(await readT(p.replace(/worksheets\//,'worksheets/_rels/')+'.rels')||'');
      const drTgt=Object.values(shRels).find(t=>/drawing/i.test(t)); if(!drTgt) return null;
      const drPath=normPath(p,drTgt); const drXml=await readT(drPath)||'';
      const drRels=relMap(await readT(drPath.replace(/drawings\//,'drawings/_rels/')+'.rels')||'');
      const anchors=[]; const are=/<xdr:(?:twoCell|oneCell)Anchor[\s\S]*?<\/xdr:(?:twoCell|oneCell)Anchor>/g; let am;
      while((am=are.exec(drXml))){ const a=am[0]; const col=+((/<xdr:from>[\s\S]*?<xdr:col>(\d+)<\/xdr:col>/.exec(a)||[])[1]||-1); const row=+((/<xdr:from>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/.exec(a)||[])[1]||-1); const emb=(/r:embed="(rId\d+)"/.exec(a)||[])[1]; if(emb) anchors.push({col,row,emb}); }
      const cands=anchors.filter(a=>a.col>=colMin&&a.col<=colMax&&a.row<=rowMax).sort((a,b)=>a.col-b.col||a.row-b.row); const pick=cands[0]||(strict?null:anchors[0]); if(!pick||!drRels[pick.emb]) return null;
      const mf=zip.file(normPath(drPath,drRels[pick.emb])); if(!mf) return null;
      return await resizeBlob(await mf.async('blob'));
    }catch(e){ return null; }
  };
  return {SST, sheets, order, cellsOf:async name=>{const x=await readT(sheets[name]); return x?parseCells(x):null;}, rawOf:async name=>readT(sheets[name]), photoOf};
}
async function resizeBlob(blob,max=440){
  if(typeof createImageBitmap==='undefined') return null;
  try{ const bm=await createImageBitmap(blob); const k=Math.min(1,max/Math.max(bm.width,bm.height)); const c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k); c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.78); }catch(e){ return null; }
}
function kind(book){ if(book.sheets.RESUMO && book.order.filter(n=>/^M\d+$/i.test(n)).length>50) return 'debora'; if(book.sheets.CONTROLE && book.sheets.OFICINA) return 'roberto'; if(book.order.filter(n=>/^T\d+$/i.test(n)).length>5) return 'estoque'; return 'desconhecido'; }

/* ---------- códigos de modelo ---------- */
function tokensOf(s){ const out=[]; const re=/B\s?\d{4,7}(?:-\d{2})?|\d{5,7}(?:-\d{2})?/gi; let m; while((m=re.exec(String(s||'').toUpperCase()))){ const c=m[0].replace(/\s/g,'').replace('-',''); if(!out.includes(c)) out.push(c);} return out; }
function baseOf(c){ c=String(c||''); const m=/^B/.test(c)?/^(B\d{4})/.exec(c):/^(\d{5})/.exec(c); return m?m[1]:''; }
function isRep(c){ c=String(c||''); return /^B/.test(c)?c.length>=7:c.length>=7; }

/* ---------- DEBORA ---------- */
async function parseDebora(book){
  const g=mkGetters(await book.cellsOf('RESUMO'),book.SST);
  const models=[];
  for(let r=4;r<=520;r++){
    const aba=g.txt('B'+r); if(!/^M\d+$/i.test(aba)) continue;
    const status=g.txt('L'+r); if(!status||/descartado/i.test(status)) continue;
    let nome=g.txt('C'+r);
    if(!nome && !/andamento|conclu/i.test(status)) continue;
    const concl=/conclu/i.test(status);
    let fase=g.txt('AB'+r); if(!FASES.includes(fase)){ const n=g.num('S'+r); fase=n?FASES[n-1]||'':''; }
    if(concl) fase='Embalagem';
    models.push({aba:aba.toUpperCase(), nome, codigo:'', forn:g.txt('D'+r), qt:g.num('E'+r), ini:serialISO(g.num('F'+r)), prazo:serialISO(g.num('G'+r)), term:serialISO(g.num('H'+r)),
      prog:g.num('J'+r)==null?null:Math.round(g.num('J'+r)*100), status, concl, fase, faseVazia:!fase, novorep:g.txt('AF'+r).toLowerCase(), nf:'', items:[]});
  }
  for(const m of models){
    const cells=await book.cellsOf(m.aba); if(!cells) continue;
    const s=mkGetters(cells,book.SST);
    m.nf=s.txt('E3').replace(/\.0$/,'');
    if(!m.nome) m.nome=s.txt('B4');
    m.qt=m.qt??s.num('E7');
    const tk=tokensOf(m.nome); m.codigo=tk[0]||'';
    let etapa='';
    for(let r=11;r<=31;r++){
      const item=s.txt('B'+r); if(!item) continue;
      const e=s.txt('A'+r); if(e) etapa=e.replace(/^\d\.\s*/,'').replace(/\s*∥.*$/,'');
      m.items.push({etapa, item, resp:s.txt('C'+r), data:anyISO(s,'D'+r), status:s.txt('E'+r), obs:s.txt('F'+r)});
    }
    const it=k=>m.items.find(x=>x.item.toUpperCase().startsWith(k));
    m.risco=!!(it('RISCO')&&/conclu/i.test(it('RISCO').status));
    m.foto=await book.photoOf(m.aba,7,8,12);
    m.enfesto=!!(it('ENFESTO')&&/conclu/i.test(it('ENFESTO').status));
  }
  return models.filter(m=>m.nome);
}

/* ---------- ROBERTO (CONTROLE) ---------- */
async function parseRoberto(book){
  const cells=await book.cellsOf('CONTROLE'); const g=mkGetters(cells,book.SST);
  const cols={}; for(const a in cells){ const m=/^([A-Z]+)1$/.exec(a); if(m){ const h=g.txt(a).toUpperCase().replace(/\s+/g,' '); cols[h]=m[1]; } }
  const col=(...names)=>{ for(const n of names){ for(const h in cols) if(h.startsWith(n)) return cols[h]; } return null; };
  const C={modelo:col('MODELO'),desc:col('DESCRI'),qtd:col('QTD'),of:col('OFICINA'),corte:col('CORTE'),saida:col('SAÍDA','SAIDA'),amostra:col('AMOSTRA'),prev:col('CHEGADA PREVISTA'),real:col('CHEGADA REAL'),status:col('STATUS'),tecido:col('TECIDO'),obs:col('OBSERVA')};
  if(!C.modelo||!C.corte) throw new Error('CONTROLE sem colunas MODELO/CORTE');
  const lots=[];
  for(let r=2;r<=2000;r++){
    const modelo=g.txt(C.modelo+r); if(!modelo) continue;
    lots.push({modelo, tokens:tokensOf(modelo), desc:g.txt(C.desc+r), qtd:g.num(C.qtd+r), oficina:g.txt(C.of+r), corte:anyISO(g,C.corte+r), saida:C.saida?anyISO(g,C.saida+r):null,
      prev:C.prev?anyISO(g,C.prev+r):null, real:C.real?anyISO(g,C.real+r):null, status:C.status?g.txt(C.status+r):'', tecido:C.tecido?g.txt(C.tecido+r):'', obs:C.obs?g.txt(C.obs+r):''});
  }
  /* CUSTO: consumo real m/peça por modelo (só linhas preenchidas) */
  const custo=[];
  if(book.sheets.CUSTO){
    const cc=await book.cellsOf('CUSTO'); const h=mkGetters(cc,book.SST);
    let hr=0, hc={}; for(let r=1;r<=10&&!hr;r++){ for(const a in cc){ const m=new RegExp('^([A-Z]+)'+r+'$').exec(a); if(m&&/^MODELO/i.test(h.txt(a))) hr=r; } }
    if(hr){ for(const a in cc){ const m=new RegExp('^([A-Z]+)'+hr+'$').exec(a); if(m) hc[h.txt(a).toUpperCase().replace(/\s+/g,' ')]=m[1]; }
      const col=n=>{ for(const k in hc) if(k.startsWith(n)) return hc[k]; return null; };
      const C={modelo:col('MODELO'),nf:col('NF'),corte:col('DATA CORTE'),tecido:col('TECIDO'),cons:col('CONSUMO'),qtd:col('QTD LOTE'),ct:col('CUSTO TECIDO'),cost:col('COSTURA'),avi:col('AVIAM'),emb:col('EMBAL')};
      if(C.modelo&&C.cons) for(let r=hr+1;r<=2000;r++){ const modelo=h.txt(C.modelo+r); if(!modelo) continue; const cons=h.num(C.cons+r); if(!(cons>0)) continue;
        custo.push({modelo,tokens:tokensOf(modelo),nf:C.nf?h.txt(C.nf+r).replace(/\.0$/,''):'',corte:C.corte?anyISO(h,C.corte+r):null,tecido:C.tecido?h.txt(C.tecido+r):'',cons,qtd:C.qtd?h.num(C.qtd+r):null,
        ct:C.ct?h.num(C.ct+r):null,cost:C.cost?h.num(C.cost+r):null,avi:C.avi?h.num(C.avi+r):null,emb:C.emb?h.num(C.emb+r):null}); }
    }
  }
  /* OFICINA: R$/peça e defeitos por lote */
  const ofic=[];
  if(book.sheets.OFICINA){
    const oc=await book.cellsOf('OFICINA'); const h=mkGetters(oc,book.SST);
    let hr=0, hc={}; for(let r=1;r<=10&&!hr;r++){ for(const a in oc){ const m=new RegExp('^([A-Z]+)'+r+'$').exec(a); if(m&&/^MODELO$/i.test(h.txt(a))) hr=r; } }
    if(hr){ for(const a in oc){ const m=new RegExp('^([A-Z]+)'+hr+'$').exec(a); if(m) hc[h.txt(a).toUpperCase().replace(/\s+/g,' ')]=m[1]; }
      const col=n=>{ for(const k in hc) if(k.startsWith(n)) return hc[k]; return null; };
      const C={modelo:col('MODELO'),of:col('OFICINA'),qtd:col('QTD'),cheg:col('CHEGADA'),def:col('TOTAL DEF'),rs:col('R$/PE'),valor:col('VALOR'),status:col('STATUS')};
      if(C.modelo&&C.of) for(let r=hr+1;r<=2000;r++){ const modelo=h.txt(C.modelo+r); if(!modelo) continue;
        ofic.push({modelo,oficina:h.txt(C.of+r),qtd:h.num(C.qtd+r)||0,cheg:C.cheg?anyISO(h,C.cheg+r):null,def:C.def?h.num(C.def+r)||0:0,rs:C.rs?h.num(C.rs+r):null,valor:C.valor?h.num(C.valor+r):null,status:C.status?h.txt(C.status+r):''}); }
    }
  }
  return {lots,custo,ofic};
}
/* m/pç REAL de um modelo: linha do CUSTO do mesmo código ou do mesmo base (episódio anterior) — nunca estimativa */
function consumoReal(m){
  if(!m.codigo||!ROB.custo) return null;
  const b=baseOf(m.codigo);
  const rows=ROB.custo.filter(c=>c.tokens.includes(m.codigo)||c.tokens.some(t=>baseOf(t)===b)).sort((x,y)=>(y.corte||'')<(x.corte||'')?-1:1);
  if(!rows.length) return null; const c=rows[0];
  return {cons:c.cons, ref:c.modelo, corte:c.corte, mesmo:c.tokens.includes(m.codigo)};
}

/* ---------- ESTOQUE_TECIDOS (só o necessário p/ a foto e o elo por NF) ---------- */
async function parseEstoque(book){
  const items=[];
  for(const name of book.order.filter(n=>/^T\d+$/i.test(n))){
    const cells=await book.cellsOf(name); if(!cells) continue; const g=mkGetters(cells,book.SST);
    const nome=g.txt('C5'); const entrada=g.num('C31'); if(!nome&&!(entrada>0)) continue;
    const comp=[]; for(let r=7;r<=11;r++){const p=g.num('C'+r),f=g.txt('D'+r); if(p>0&&f) comp.push((p%1?p:Math.round(p))+'% '+f.toUpperCase());}
    const stTxt=g.txt('C34'); const estq=g.num('C32')||0;
    const status=/esgotado/i.test(stTxt)?'esgotado':(/estoque/i.test(stTxt)?'estoque':(estq>0?'estoque':'esgotado'));
    const cores=[]; for(let r=22;r<=28;r++){const cor=g.txt('K'+r); if(!cor) continue; cores.push({cor:cor.toUpperCase(), entrada:g.num('L'+r)||0, saldo:g.num('O'+r)||0, pct:g.num('P'+r)||0, data:serialISO(g.num('J'+r))});}
    items.push({code:name.toUpperCase(), nome, forn:g.txt('G4'), nf:g.txt('G5').replace(/\.0$/,''), estoque:estq, usado:g.num('G31')||0, status, comp:comp.join(' / '),
      estacao:g.txt('G6'), preco:g.num('C16'), largura:g.num('G14'), gramatura:g.num('C14'), mediaRolo:g.num('G22'), dataEntrada:anyISO(g,'G19'), cores, foto:await book.photoOf(name,8,10,17,true)});
  }
  return items;
}
function nfKeys(nf){ return String(nf==null?'':nf).split(/[^0-9]+/).map(x=>x.replace(/^0+/,'')).filter(x=>x.length>=3); }
function nfMatch(a,b){ const A=nfKeys(a); if(!A.length) return false; const B=new Set(nfKeys(b)); return A.some(k=>B.has(k)); }
function tecidoOf(m){ if(!m.nf) return []; return TEC.items.filter(t=>nfMatch(m.nf,t.nf)); }
function modelosDe(t){ if(!t.nf) return []; return DEB.models.filter(m=>nfMatch(m.nf,t.nf)); }
/* mesmos-tecido: outros modelos ativos ligados à mesma NF (normalizada), mesmo sem aba T */
function mesmoTecido(m){ if(!nfKeys(m.nf).length) return []; return DEB.models.filter(x=>x!==m&&!x.concl&&nfMatch(x.nf,m.nf)); }
const PRE_CORTE=['Design','Amostra','Materiais'];

/* ---------- ELO: ligação e estados ---------- */
function lotState(l){ return l.real?'entregue':(l.saida?'oficina':(l.corte?'parado':'?')); }
function lotsOf(m){
  if(!m.codigo) return {lots:[],how:'semcodigo'};
  const ex=ROB.lots.filter(l=>l.tokens.includes(m.codigo));
  if(ex.length) return {lots:ex,how:'exato'};
  const b=baseOf(m.codigo);
  const fam=ROB.lots.filter(l=>l.tokens.some(t=>baseOf(t)===b));
  if(fam.length&&m.ini){ const ep=fam.filter(l=>l.corte&&l.corte>=m.ini); if(ep.length) return {lots:ep,how:'episodio'}; }
  return {lots:[],how:fam.length?'anterior':'naocortado'};
}
/* estado composto (6 elos) + alertas */
function eloOf(m){
  const {lots,how}=lotsOf(m);
  const st=lots.length?(lots.some(l=>lotState(l)==='oficina')?'oficina':(lots.every(l=>lotState(l)==='entregue')?'entregue':'parado')):'';
  const fi=FASES.indexOf(m.fase);
  let elo, alert=null;
  if(st==='entregue'){ elo='entregue'; if(fi>=0&&fi<FASES.indexOf('Qualidade')&&!m.concl) alert={k:'atualizar',t:'oficina já entregou — avançar p/ Qualidade'}; }
  else if(st==='oficina'){ elo='oficina'; if(fi<FASES.indexOf('Costura')) alert={k:'atualizar',t:'lote já na oficina — avançar p/ Costura'}; }
  else if(st==='parado'){ elo='parado'; if(m.fase==='Corte'||m.faseVazia) alert={k:'atualizar',t:'Roberto já cortou — avançar p/ Costura'}; else if(fi<FASES.indexOf('Corte')) alert={k:'verificar',t:`cortado pelo Roberto mas DEBORA em ${m.fase}`}; }
  else if(m.fase==='Corte'){ if(how==='semcodigo'){ elo='semcodigo'; alert={k:'verificar',t:'em Corte sem código de modelo'}; } else elo=m.risco?'preparando':'fila'; }
  else if(fi>=FASES.indexOf('Costura')&&!m.concl){ elo='semlote'; alert={k:'verificar',t:`DEBORA em ${m.fase} mas sem lote no CONTROLE`}; }
  else elo='design';
  if(m.faseVazia&&!alert) alert={k:'verificar',t:'sem etapa no RESUMO'};
  return {elo,lots,how,alert};
}
const ELO_LBL={semcodigo:'sem código',design:'antes do corte',fila:'fila de corte',preparando:'preparando · risco ✓',parado:'cortado · parado',oficina:'na oficina',entregue:'entregue',semlote:'sem lote'};
const ELO_ORDER=['fila','preparando','parado','oficina','entregue'];
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
const TODAY=new Date().toISOString().slice(0,10);
function dtBR(iso){ if(!iso) return ''; const [y,m,d]=String(iso).slice(0,10).split('-'); return `${d}/${m}/${y.slice(2)}`; }
function fmt(n){ return n==null?'—':Number(n).toLocaleString('pt-BR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function computeAll(){
  const act=DEB.models.filter(m=>!m.concl);
  const rows=act.map(m=>({m,...eloOf(m)}));
  const atualizar=rows.filter(r=>r.alert&&r.alert.k==='atualizar');
  const verificar=rows.filter(r=>r.alert&&r.alert.k==='verificar');
  const fila=rows.filter(r=>r.elo==='fila'||r.elo==='preparando');
  const usedTok=new Set(); rows.forEach(r=>r.lots.forEach(l=>l.tokens.forEach(t=>usedTok.add(t))));
  const actBases=new Set(act.map(m=>baseOf(m.codigo)).filter(Boolean));
  const semFicha=ROB.lots.filter(l=>!l.real&&!l.tokens.some(t=>usedTok.has(t))&&!l.tokens.some(t=>actBases.has(baseOf(t))));
  return {rows,atualizar,verificar,fila,semFicha};
}

/* ---------- storage ---------- */
function dbOpen(){ return new Promise((res,rej)=>{ const rq=indexedDB.open(DB_NAME,1); rq.onupgradeneeded=()=>rq.result.createObjectStore(DB_STORE); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function dbGet(k){ try{ const db=await dbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction(DB_STORE).objectStore(DB_STORE).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return null; } }
async function dbSet(k,v){ try{ const db=await dbOpen(); await new Promise((res,rej)=>{ const t=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(v,k); t.onsuccess=res; t.onerror=()=>rej(t.error); }); }catch(e){} }

/* ---------- import ---------- */
async function importFile(file){
  if(!/\.xlsx$/i.test(file.name)){ toast('Só .xlsx: '+file.name); return; }
  toast('⏳ Lendo '+file.name+'…',60000);
  try{
    const zip=await JSZip.loadAsync(file); const book=await openBook(zip); const k=kind(book);
    if(k==='debora'){ const models=await parseDebora(book); toast('⏳ Enviando DEBORA p/ nuvem…',60000); await cloudSaveDeb(models,file.name); toast(`✅ DEBORA: ${models.length} modelos (${models.filter(m=>!m.concl).length} em andamento) · na nuvem`); }
    else if(k==='roberto'){ const {lots,custo,ofic}=await parseRoberto(book); const r={lots,custo,ofic,at:new Date().toISOString(),file:file.name}; await cloudSaveRob(r); toast(`✅ ROBERTO: ${lots.length} lotes · ${custo.length} consumos · na nuvem`); }
    else if(k==='estoque'){ const items=await parseEstoque(book); toast('⏳ Enviando ESTOQUE p/ nuvem…',60000); const r=await cloudImportEstoque(items,file.name); toast(`✅ ESTOQUE: ${r.novos} novo(s) · ${r.atual} atualizado(s) · ${r.ig} mantido(s) (editados no app)`,7000); }
    else toast('❌ Arquivo não reconhecido: '+file.name,7000);
  }catch(e){ console.error(e); toast('❌ '+file.name+': '+e.message,9000); }
}
/* ---------- nuvem (Firestore) ---------- */
async function cloudSaveDeb(models,fname){
  const {db,collection,doc,getDocs,writeBatch}=FB; const at=new Date().toISOString();
  const old=await getDocs(collection(db,'elo_deb')); const keep=new Set(models.map(m=>m.aba));
  let b=writeBatch(db),n=0; const flush=async()=>{ await b.commit(); b=writeBatch(db); n=0; };
  for(const d of old.docs){ if(!keep.has(d.id)){ b.delete(d.ref); if(++n>=400) await flush(); } }
  for(const m of models){ b.set(doc(db,'elo_deb',m.aba),m); if(++n>=400) await flush(); }
  b.set(doc(db,'elo','deb_meta'),{at,file:fname,count:models.length,by:FBUSER?FBUSER.email:''}); await b.commit();
}

function cloudSubscribe(){
  const {db,collection,doc,onSnapshot}=FB; FBUNSUB.forEach(f=>f()); FBUNSUB=[];
  FBUNSUB.push(onSnapshot(doc(db,'config','cfg'),s=>{ CFG=s.exists()?s.data():{}; }));
  FBUNSUB.push(onSnapshot(collection(db,'pedidos'),s=>{ PED=s.docs.map(d=>d.data()); render(); },e=>toast('Erro pedidos: '+e.code)));
  FBUNSUB.push(onSnapshot(collection(db,'tecidos'),s=>{ TDOCS=s.docs.map(d=>d.data()); TEC={items:tecFromCloud(TDOCS),at:new Date().toISOString(),file:'app TECIDOS (nuvem)'}; render(); },e=>toast('Erro tecidos: '+e.code)));
  FBUNSUB.push(onSnapshot(collection(db,'elo_deb'),s=>{ const models=s.docs.map(d=>d.data()).sort((a,b)=>+a.aba.replace(/\D/g,'')-+b.aba.replace(/\D/g,'')); DEB={models,at:DEB.at,file:DEB.file}; render(); },e=>toast('Erro DEBORA: '+e.code)));
  FBUNSUB.push(onSnapshot(doc(db,'elo','deb_meta'),s=>{ if(s.exists()){ const m=s.data(); DEB.at=m.at; DEB.file=m.file; render(); } }));
  FBUNSUB.push(onSnapshot(doc(db,'elo','rob'),s=>{ if(s.exists()){ ROB=s.data(); render(); } }));
  FBUNSUB.push(onSnapshot(doc(db,'elo','todo'),s=>{ if(s.exists()){ TODO=Object.assign({done:{},extra:[]},s.data()); render(); } }));
}

}

/* ---------- checklist do Roberto (gerada dos dados + itens manuais) ---------- */
function todoItems(A,ctx){
  const it=[];
  /* cortar: por TECIDO (grupo da fila), não por modelo — cortar junto quando há 2+ */
  filaGroups(A).forEach(g=>{
    const pr=g.rows.filter(r=>r.elo==='preparando'), ag=g.rows.filter(r=>r.elo==='fila');
    const lbl=g.tec?g.tec.code+' '+g.tec.nome:g.key; const pcs=pr.reduce((s,r)=>s+(r.m.qt||0),0);
    const ids=pr.map(r=>r.m.aba).join('+');
    if(pr.length){
      const cod=r=>r.m.codigo||r.m.aba; const pz=r=>r.m.prazo?' · prazo '+dtBR(r.m.prazo):'';
      let t;
      if(pr.length>1) t=`CORTAR JUNTO — ${lbl} → ${pr.map(cod).join(' + ')} · ${fmt(pcs)} pçs`;
      else if(ag.length) t=`${lbl} → ${cod(pr[0])} · ${fmt(pcs)} pçs · AJUNTAR COM ${ag.map(r=>cod(r)+' (sem risco'+pz(r)+')').join(', ')}`;
      else { const up=mesmoTecido(pr[0].m).filter(x=>PRE_CORTE.includes(x.fase));
        t=`${lbl} → ${cod(pr[0])} · ${fmt(pcs)} pçs${pz(pr[0])} · ${up.length?'vem aí: '+up.map(x=>(x.codigo||x.aba)+' ('+x.fase+(x.prazo?' · '+dtBR(x.prazo):'')+')').join(', ')+' — juntar ou cortar só?':'nenhum outro modelo nesta NF — confirmar e cortar'}`;
        it.push({id:'cut:'+g.key+':'+ids, g:'❓ cortar ou pode juntar?', t, aba:pr[0].m.aba, plano:g.key, pri:up.length?0:1}); return; }
      it.push({id:'cut:'+g.key+':'+ids, g:'✂ cortar', t, aba:pr[0].m.aba, plano:g.key, pri:pr.length>1?0:1});
    } else if(g.rows.length>1){
      it.push({id:'risco:'+g.key, g:'📐 risco p/ cortar junto', t:`${lbl} → ${g.rows.map(r=>r.m.codigo||r.m.aba).join(' + ')} · pedir encaixe combinado`, aba:g.rows[0].m.aba, plano:g.key});
    }
  });
  ctx.par.forEach(l=>{const r=A.rows.find(x=>x.lots.includes(l)); it.push({id:'out:'+l.modelo, g:'📦 dar saída', t:`${l.modelo} · cortado ${dtBR(l.corte)}${l.qtd?' · '+fmt(l.qtd)+' pçs':''}`, aba:r&&r.m.aba});});
  ctx.late.forEach(l=>{const r=A.rows.find(x=>x.lots.includes(l)); it.push({id:'late:'+l.modelo+l.saida, g:'📞 cobrar oficina', t:`${l.oficina} · ${l.modelo} · prev. ${dtBR(l.prev)} (+${daysBetween(l.prev,TODAY)}d)`, aba:r&&r.m.aba});});
  A.atualizar.forEach(r=>it.push({id:'atu:'+r.m.aba, g:'📝 avisar Debora', t:`${r.m.aba} · ${r.m.codigo||'—'} — ${r.alert.t}`, aba:r.m.aba}));
  A.semFicha.forEach(l=>it.push({id:'ficha:'+l.modelo, g:'⚠ verificar', t:`${l.modelo} sem ficha na DEBORA`}));
  TODO.extra.forEach(x=>it.push({id:'x:'+x.id, g:'✎ manual', t:x.t, manual:true}));
  return it.sort((a,b)=>(a.pri??5)-(b.pri??5));
}
function renderTodo(A,ctx){
  const items=todoItems(A,ctx); const ORDER=['✂ cortar','📐 risco p/ cortar junto','❓ cortar ou pode juntar?','📦 dar saída','📞 cobrar oficina','📝 avisar Debora','⚠ verificar','✎ manual'];
  const groups=[...new Set(items.map(i=>i.g))].sort((a,b)=>(ORDER.indexOf(a)+99)%99-(ORDER.indexOf(b)+99)%99);
  const done=items.filter(i=>TODO.done[i.id]).length;
  return `<div class="panel todo"><div class="ptog"><h3>Checklist do dia <span>${done}/${items.length}</span></h3><button class="tg" onclick="todoClear()">limpar feitos</button></div>
    <div class="bar"><i style="width:${items.length?Math.round(done/items.length*100):0}%"></i></div>
    ${groups.map(g=>{const gi=items.filter(i=>i.g===g); return `<div class="tg-h">${g} <span>${gi.filter(i=>!TODO.done[i.id]).length}</span></div>${gi.map(i=>`<label class="ti ${TODO.done[i.id]?'d':''}"><input type="checkbox" ${TODO.done[i.id]?'checked':''} onchange="todoToggle('${i.id.replace(/'/g,'')}',this.checked)"><span>${esc(i.t)}</span>${i.plano?`<button onclick="event.preventDefault();PLANO.key='${i.plano.replace(/'/g,'')}';VIEW='plano';render()">✂ plano</button>`:(i.aba?`<button onclick="event.preventDefault();openModel('${i.aba}')">ficha</button>`:'')}${i.manual?`<button onclick="event.preventDefault();todoRemove('${i.id.slice(2)}')">✕</button>`:''}</label>`).join('')}`;}).join('')}
    <form class="tadd" onsubmit="event.preventDefault();todoAdd(this.q.value);this.q.value=''"><input name="q" placeholder="+ tarefa manual (ex.: comprar linha p/ T30)"><button class="tg on">add</button></form>
    <div class="sm">Fluxo: <b>✂ cortar</b> (prontos; junta 2+ do mesmo tecido) → <b>📐 risco p/ cortar junto</b> (2+ modelos, nenhum pronto) → <b>❓ cortar ou pode juntar?</b> (1 modelo pronto sozinho no tecido: confirmar se alguém entra, pedir risco, depois cortar). Marcações ficam salvas neste navegador.</div></div>`;
}
async function todoToggle(id,v){ if(v) TODO.done[id]=TODAY; else delete TODO.done[id]; await cloudSaveTodo(); render(); }

/* ---------- velocidade por oficina: pçs recebidas/mês + lead médio ---------- */
function renderVelocidade(){
  const N=6; const months=[]; const d=new Date(TODAY+'T00:00:00');
  for(let i=N-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); months.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const by={};
  ROB.lots.filter(l=>l.oficina).forEach(l=>{
    const o=by[l.oficina]=by[l.oficina]||{n:0,pcs:0,lead:[],ontime:0,late:0,m:{},open:0,openPcs:0};
    if(l.real){ const k=l.real.slice(0,7); if(months.includes(k)){ o.m[k]=(o.m[k]||0)+(l.qtd||0); }
      o.n++; o.pcs+=l.qtd||0; if(l.saida){ o.lead.push(daysBetween(l.saida,l.real)); if(l.prev){ if(l.real<=l.prev) o.ontime++; else o.late++; } } }
    else if(l.saida){ o.open++; o.openPcs+=l.qtd||0; }
  });
  /* preço e defeitos da aba OFICINA */

/* CUSTO VERÃO: médias por peça desde 01/06 — regras: AVIAM./EMBAL. vazios = 0 (confirmado 24/08); COSTURA vazia = lote ainda não costurado, fora das médias; pares base+" A" no mesmo corte somados (ex.: B 3749) */
const VERAO_INI='2026-06-01';
function custoVerao(){
  if(!ROB.custo||!ROB.custo.length) return null;
  let rows=ROB.custo.filter(c=>c.corte&&c.corte>=VERAO_INI&&c.ct!=null).map(c=>({...c,avi:c.avi||0,emb:c.emb||0}));
  if(!rows.length) return null;
  /* fundir "X A" com "X" (mesmo corte): tecido soma, costura/aviam/embal do que tiver */
  for(const a of rows.filter(r=>/ A\s*$/.test(r.modelo))){
    const base=rows.find(r=>r!==a&&r.modelo.trim()===a.modelo.replace(/ A\s*$/,'').trim()&&r.corte===a.corte);
    if(base){ base.ct+=a.ct; base.cons+=a.cons; if(base.cost==null)base.cost=a.cost; base.avi+=a.avi; base.emb+=a.emb; rows=rows.filter(r=>r!==a); }
  }
  const med=v=>{const s=[...v].sort((a,b)=>a-b); const n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;};
  const st=(vals)=>{const v=vals.map(x=>x[0]); const W=vals.reduce((s,x)=>s+(x[1]||0),0);
    return {n:v.length, media:v.reduce((s,x)=>s+x,0)/v.length, mediana:med(v), pond:W?vals.reduce((s,x)=>s+x[0]*(x[1]||0),0)/W:null};};
  const rc=rows.filter(r=>r.cost!=null);
  return { n:rows.length, nCost:rc.length, semCost:rows.filter(r=>r.cost==null).map(r=>r.modelo),
    tec:st(rows.map(r=>[r.ct,r.qtd])), cost:st(rc.map(r=>[r.cost,r.qtd])),
    avi:st(rows.map(r=>[r.avi,r.qtd])), emb:st(rows.map(r=>[r.emb,r.qtd])),
    extra:st(rows.map(r=>[r.avi+r.emb,r.qtd])), total:st(rc.map(r=>[r.ct+r.cost+r.avi+r.emb,r.qtd])) };
}
const brl=v=>v==null?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function renderCustoVerao(cv){
  const L=[['Tecido',cv.tec,''],['Costura',cv.cost,` (${cv.nCost})`],['Aviamentos',cv.avi,''],['Embal.+outros',cv.emb,''],['Aviam.+embal.',cv.extra,''],['CUSTO TOTAL',cv.total,` (${cv.nCost})`]];

  const ks=Object.keys(g).sort(); if(ks.length<2) return '';

  const meta={snapshot:true, by:quem||'—', at:stamp, deb:DEB.file, rob:ROB.file, tec:TEC.file};

  if(!/<script id="seed">[\s\S]*?<\/script>/.test(SRC)){ toast('❌ não achei o bloco de dados nesta página'); return; }
  const html='<!DOCTYPE html>\n'+SRC.replace(/<script id="seed">[\s\S]*?<\/script>/,seed);
  const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`ELO_${pad(now.getDate())}-${pad(now.getMonth()+1)}-${String(now.getFullYear()).slice(2)}_${pad(now.getHours())}${pad(now.getMinutes())}${quem?'_'+quem.replace(/\s+/g,''):''}.html`;

/* ---------- prévia de foto: hover (PC) / toque longo (celular) ---------- */
(function(){
  const pv=document.createElement('div'); pv.id='pv'; pv.innerHTML='<img alt="">'; document.body.appendChild(pv);
  const im=pv.querySelector('img'); let t=null, cur=null;
  const SEL='.card img.th,.fgh img,.ofl img,.tc img,.tfoto,.fotos img,.fup img,.pc .ph img,.tmod .ph img,.sw-th';
  const show=(el,x,y)=>{ if(!el||!el.src||el.src.length<200) return; im.src=el.src; pv.classList.add('on'); place(x,y); };
  const place=(x,y)=>{ const W=window.innerWidth,H=window.innerHeight; const w=Math.min(328,W-16),h=Math.min(328,H-16);
    let L=x+18,T=y+18; if(L+w>W-8) L=x-w-18; if(L<8) L=8; if(T+h>H-8) T=Math.max(8,H-8-h); pv.style.left=L+'px'; pv.style.top=T+'px'; };
  const hide=()=>{ pv.classList.remove('on'); cur=null; clearTimeout(t); };
  document.addEventListener('mouseover',e=>{ const el=e.target.closest&&e.target.closest(SEL); if(!el||el===cur) return; cur=el; clearTimeout(t); t=setTimeout(()=>show(el,e.clientX,e.clientY),150); });
  document.addEventListener('mousemove',e=>{ if(pv.classList.contains('on')) place(e.clientX,e.clientY); });
  document.addEventListener('mouseout',e=>{ const el=e.target.closest&&e.target.closest(SEL); if(el&&el===cur) hide(); });
  document.addEventListener('scroll',hide,true);
  document.addEventListener('touchstart',e=>{ const el=e.target.closest&&e.target.closest(SEL); if(!el) return; const p=e.touches[0]; clearTimeout(t); t=setTimeout(()=>{ cur=el; show(el,p.clientX,p.clientY); },450); },{passive:true});
  ['touchend','touchcancel','touchmove'].forEach(ev=>document.addEventListener(ev,()=>{ clearTimeout(t); if(cur) hide(); },{passive:true}));
})();

async function pickPhoto(cb,max=800){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=async()=>{ const f=i.files[0]; if(!f) return; const d=await resizeBlob(f,max); if(d&&d.length>900000){ toast('Foto muito grande, tente outra'); return; } cb(d); }; i.click(); }

function openTec(t){ if(!t) return; cur=JSON.parse(JSON.stringify(t)); if(!cur.cores) cur.cores=[]; drawTec(); }
function drawTec(){ const t=cur; const inp=(k,l,type='text',cls='')=>`<div class="fi ${cls}"><label>${l}</label><input data-k="${k}" type="${type}" value="${esc(t[k]==null?'':t[k])}"></div>`;
  const corRows=t.cores.map((c,i)=>`<tr><td><input data-cor="${i}" data-f="cor" value="${esc(c.cor||'')}"></td><td><input data-cor="${i}" data-f="entrada" value="${c.entrada??''}"></td><td><input data-cor="${i}" data-f="saldo" value="${c.saldo??''}"></td></tr>`).join('');
  openMod((t.novo?'NOVO · ':'')+t.code+(t.nome?' · '+t.nome:''),`
  <div class="sec"><div class="photo"><div class="ph" id="tPh">${t.foto?`<img src="${t.foto}">`:'SEM FOTO'}</div><div class="ops"><button class="tb" id="tFoto">📷 FOTO</button>${t.foto?'<button class="tb red" id="tFotoDel">REMOVER</button>':''}</div></div></div>
  <div class="sec"><h3>TECIDO</h3><div class="f">${inp('code','CÓDIGO T')}${inp('nome','NOME')}${inp('forn','FORNECEDOR')}${inp('nf','NF')}${inp('comp','COMPOSIÇÃO (ex.: 100% VISCOSE)')}${inp('estacao','ESTAÇÃO')}</div>
    <div class="f c3" style="margin-top:8px">${inp('preco','PREÇO R$/m')}${inp('largura','LARGURA (m)')}${inp('gramatura','GRAMATURA g/m²')}</div>
    <div class="f" style="margin-top:8px">${inp('dataEntrada','ENTRADA (dd/mm/aa)')}<div class="fi"><label>OBS</label><input data-k="obs" value="${esc(t.obs||'')}"></div></div></div>
  <div class="sec"><h3>ESTOQUE · ${tfmt(t.estoque,1)} m</h3><div class="f c3"><div class="fi"><label>AJUSTE (m, use − p/ saída)</label><input id="ajM" placeholder="ex.: -120 ou 300"></div><div class="fi" style="grid-column:span 2"><label>MOTIVO</label><input id="ajMot" placeholder="corte lote 12185 · sobra · inventário…"></div></div><button class="tb" id="bAj" style="margin-top:8px">APLICAR AJUSTE</button>
    <div class="hist" id="hist" style="margin-top:8px"><div class="sm">carregando histórico…</div></div></div>
  <div class="sec"><h3>CORES</h3><table class="t"><thead><tr><th>COR</th><th>ENTRADA m</th><th>SALDO m</th></tr></thead><tbody id="corBody">${corRows}</tbody></table><button class="tb" id="bAddCor" style="margin-top:6px">+ COR</button></div>
  ${t.novo?'':'<div class="sec"><button class="tb red" id="bDelT">EXCLUIR TECIDO</button></div>'}`,
  `<button class="tb" id="bCancel">CANCELAR</button><button class="tb ok" id="bSaveT">SALVAR</button>`);
  $('#bCancel').onclick=closeMod; $('#bSaveT').onclick=saveTec;
  $('#tFoto').onclick=()=>pickPhoto(d=>{cur.foto=d;$('#tPh').innerHTML=`<img src="${d}">`;});
  const fd=$('#tFotoDel'); if(fd) fd.onclick=()=>{cur.foto=null;$('#tPh').textContent='SEM FOTO';};
  $('#bAddCor').onclick=()=>{readTec(true);cur.cores.push({cor:'',entrada:null,saldo:null});drawTec();};
  $('#bAj').onclick=applyAjuste;
  const dl=$('#bDelT'); if(dl) dl.onclick=async()=>{ if(!confirm('Excluir '+cur.code+'? Isso não apaga o histórico.')) return; await FB.deleteDoc(FB.doc(FB.db,'tecidos',cur.code)); closeMod(); toast('Tecido excluído'); };
  loadHist(t.code);
}
function readTec(keep){ $$('#tmBody [data-k]').forEach(i=>{ const k=i.dataset.k; let v=i.value.trim(); if(['preco','largura','gramatura'].includes(k)) v=tnum(v); else if(k==='dataEntrada') v=brToISO(v); else if(k==='code') v=v.toUpperCase(); cur[k]=v===''?null:v; });
  $$('#corBody input').forEach(i=>{ const c=cur.cores[+i.dataset.cor]; if(!c) return; const f=i.dataset.f; c[f]=f==='cor'?i.value.trim().toUpperCase():tnum(i.value); }); if(!keep) cur.cores=cur.cores.filter(c=>c.cor); }
async function saveTec(){ readTec(); if(!cur.code||!/^T\d+$/i.test(cur.code)){ toast('Código deve ser T + número (ex.: T54)'); return; }
  if(cur.novo&&TDOCS.find(t=>t.code===cur.code)){ toast(cur.code+' já existe'); return; }
  const t={...cur}; delete t.novo; t.status=t.estoque>0?'estoque':'esgotado'; t.updatedAt=new Date().toISOString(); t.updatedBy=by(); if(!t.createdAt) t.createdAt=t.updatedAt;
  try{ await FB.setDoc(FB.doc(FB.db,'tecidos',t.code),t); toast('Salvo · '+t.code); closeMod(); }catch(e){ toast('Erro ao salvar: '+e.code,5000); } }
async function applyAjuste(){ readTec(); const d=tnum($('#ajM').value); const mot=$('#ajMot').value.trim(); if(d==null||!d){ toast('Informe os metros'); return; } if(!mot){ toast('Escreva o motivo'); return; }
  const antes=cur.estoque||0; cur.estoque=Math.round((antes+d)*100)/100; if(d<0) cur.usado=Math.round(((cur.usado||0)-d)*100)/100;
  const mv={id:'M'+Date.now().toString(36),code:cur.code,delta:d,antes,depois:cur.estoque,motivo:mot,at:new Date().toISOString(),by:by()};
  try{ await FB.setDoc(FB.doc(FB.db,'movs',mv.id),mv); const t={...cur}; delete t.novo; t.status=t.estoque>0?'estoque':'esgotado'; t.updatedAt=mv.at; t.updatedBy=by(); await FB.setDoc(FB.doc(FB.db,'tecidos',t.code),t); toast(`Ajuste ${d>0?'+':''}${tfmt(d,1)} m → ${tfmt(t.estoque,1)} m`); drawTec(); }catch(e){ toast('Erro: '+e.code,5000); } }
async function loadHist(code){ try{ const s=await FB.getDocs(FB.query(FB.collection(FB.db,'movs'),FB.orderBy('at','desc'),FB.limit(200))); const rows=s.docs.map(d=>d.data()).filter(m=>m.code===code).slice(0,30); const h=$('#hist'); if(!h) return; h.innerHTML=rows.length?rows.map(m=>`<div><span class="d">${dtBR(m.at)} ${m.at.slice(11,16)} · ${esc(m.by)}</span><span style="flex:1">${esc(m.motivo)}</span><span class="v ${m.delta<0?'neg':'pos'}">${m.delta>0?'+':''}${tfmt(m.delta,1)}</span></div>`).join(''):'<div class="sm">sem movimentos registrados</div>'; }catch(e){ const h=$('#hist'); if(h) h.innerHTML='<div class="sm">histórico indisponível ('+e.code+')</div>'; } }

/* ---------- pedidos ---------- */
function blankPed(){ return {id:'P'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),status:'PEDIDO',criado:new Date().toISOString(),data:todayISO(),fornecedor:'',vendedor:'',pagto:'',prazo:'',numforn:'',quem:by(),codigo:'',nome:'',gram:null,larg:null,unid:'m',preco:null,tipo:'LISO',comp:[],cores:[],obs:'',foto:null,entrada:{nf:'',data:'',m:null,kg:null,insp:'OK',t:'',rolos:{}}}; }
const totalM=p=>(p.cores||[]).reduce((a,c)=>a+(tnum(c.qtd)||0),0);
function pendencias(p){ const ped=[]; if(!p.fornecedor)ped.push('fornecedor'); if(!p.nome)ped.push('nome'); if(tnum(p.gram)==null)ped.push('gramatura'); if(tnum(p.larg)==null)ped.push('largura'); if(tnum(p.preco)==null)ped.push('preço');
  if(!(p.comp||[]).some(r=>r.fibra&&tnum(r.pct)!=null))ped.push('composição'); if(!(p.cores||[]).some(c=>c.cor&&tnum(c.qtd)))ped.push('1 cor com qtd');
  const e=p.entrada||{},ent=[]; if(!e.nf)ent.push('NF'); if(!e.data)ent.push('data de entrada'); if(tnum(e.m)==null&&tnum(e.kg)==null)ent.push('qtd recebida'); return {ped,ent}; }
function openPed(p){ if(!p) return; cur=JSON.parse(JSON.stringify(p)); cur.comp=cur.comp||[]; cur.cores=cur.cores||[]; cur.entrada=Object.assign({nf:'',data:'',m:null,kg:null,insp:'OK',t:'',rolos:{}},cur.entrada||{}); drawPed(); }
function drawPed(){ const p=cur; const rec=p.status==='RECEBIDO'; const pd=pendencias(p);
  const inp=(k,l,ph='')=>`<div class="fi"><label>${l}</label><input data-k="${k}" value="${esc(p[k]==null?'':p[k])}" placeholder="${ph}" class="${pd.ped.includes(l.toLowerCase().split(' ')[0])&&p._try?'miss':''}"></div>`;
  const sel=(k,l,opts)=>`<div class="fi"><label>${l}</label><select data-k="${k}">${opts.map(o=>`<option ${p[k]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
  const comp=p.comp.map((c,i)=>`<tr><td><input data-comp="${i}" data-f="pct" value="${c.pct??''}" placeholder="%"></td><td><input data-comp="${i}" data-f="fibra" value="${esc(c.fibra||'')}" list="fibras"></td></tr>`).join('');
  const cores=p.cores.map((c,i)=>`<tr><td class="swc" data-sw="${i}" title="recortar swatch" style="cursor:${p.foto?'crosshair':'default'}">${c.thumb?`<img class="sw-th" src="${c.thumb}" style="width:32px;height:30px;border-radius:4px;object-fit:cover;border:1px solid var(--line)" title="${esc(c.obs||'')}">`:(c.hex?`<i style="display:block;width:32px;height:30px;border-radius:4px;background:${c.hex}"></i>`:`<i style="display:block;width:32px;height:30px;border-radius:4px;border:1px dashed var(--line)"></i>`)}</td><td><input data-cor="${i}" data-f="cor" value="${esc(c.cor||'')}"></td><td><input data-cor="${i}" data-f="qtd" value="${c.qtd??''}"></td><td><input data-cor="${i}" data-f="rolosPrev" value="${c.rolosPrev??''}"></td><td><input data-rol="${i}" value="${p.entrada.rolos[i]??''}"></td></tr>`).join('');
  const gram=tnum(p.gram),larg=tnum(p.larg),preco=tnum(p.preco); const rend=gram&&larg?1000/(gram*larg):null; const precoM=preco==null?null:(p.unid==='kg'?(rend?preco/rend:null):preco);
  openMod((rec?p.entrada.t+' · ':'PEDIDO · ')+(p.nome||'novo'),`
  <div class="sec"><div class="photo"><div class="ph" id="pPh">${p.foto?`<img src="${p.foto}">`:'FOTO / AMOSTRA'}</div><div class="ops"><button class="tb" id="pFoto">📷 FOTO</button><button class="tb pri" id="bRead" ${p.foto?'':'disabled'}>🤖 LER COM CLAUDE</button><button class="tb" id="bPaste">📋 COLAR LEITURA</button><span class="sm">status: <b>${p.status}</b>${rec?' · '+p.entrada.t:''}</span></div></div>${(p.unsure||[]).length?`<div class="pend">🤖 sem certeza: ${p.unsure.join(', ')} — confira</div>`:''}</div>
  <div class="sec"><h3>PEDIDO</h3><div class="f c3">${inp('data','DATA (dd/mm/aa)')}<div class="fi"><label>FORNECEDOR</label><input data-k="fornecedor" value="${esc(p.fornecedor||'')}" list="forns" class="${p._try&&!p.fornecedor?'miss':''}"></div>${inp('vendedor','VENDEDOR')}${inp('pagto','PAGTO','30/60/90')}${inp('prazo','PRAZO ENTREGA (dd/mm/aa)')}${inp('numforn','Nº PEDIDO FORN.')}</div></div>
  <div class="sec"><h3>TECIDO</h3><div class="f">${inp('codigo','CÓD. FORNECEDOR')}${inp('nome','NOME')}</div><div class="f c3" style="margin-top:8px">${inp('gram','GRAMATURA g/m²')}${inp('larg','LARGURA m')}${sel('unid','UNIDADE',['m','kg'])}${inp('preco','PREÇO R$ / unid')}${sel('tipo','TIPO',['LISO','ESTAMPADO','LISTRADO','XADREZ','JACQUARD'])}<div class="fi"><label>RENDIMENTO / PREÇO m</label><input disabled value="${rend?tfmt(rend,2)+' m/kg':'—'} · ${precoM!=null?'R$ '+tfmt(precoM,2)+'/m':'—'}"></div></div>
    <table class="t" style="margin-top:8px"><thead><tr><th style="width:80px">%</th><th>FIBRA</th></tr></thead><tbody id="compBody">${comp}</tbody></table><button class="tb" id="bAddComp" style="margin-top:6px">+ FIBRA</button><datalist id="fibras">${DEF_FIB.map(f=>`<option value="${f}">`).join('')}</datalist><datalist id="forns">${[...new Set([...DEF_FORN,...TDOCS.map(t=>t.forn).filter(Boolean)])].map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div>
  <div class="sec"><h3>CORES · ${tfmt(totalM(p))} ${p.unid}</h3><table class="t"><thead><tr><th style="width:36px"></th><th>COR</th><th>QTD</th><th>ROLOS PREV.</th><th>ROLOS RECEB.</th></tr></thead><tbody id="corBody">${cores}</tbody></table><button class="tb" id="bAddCor" style="margin-top:6px">+ COR</button> <button class="tb" id="bCrop" style="margin-top:6px" ${p.foto&&p.cores.length?'':'disabled'}>✂ RECORTAR SWATCHES</button><span class="sm" style="margin-left:8px">toque na 1ª coluna p/ recortar à mão</span></div>
  <div class="sec"><div class="fi"><label>OBS</label><textarea data-k="obs">${esc(p.obs||'')}</textarea></div>${pd.ped.length?`<div class="pend">⚠ falta: ${pd.ped.join(', ')}</div>`:''}</div>
  <div class="sec"><h3>ENTRADA${rec?' · CONFIRMADA':''}</h3><div class="f c3"><div class="fi"><label>NF</label><input data-e="nf" value="${esc(p.entrada.nf||'')}"></div><div class="fi"><label>DATA ENTRADA</label><input data-e="data" value="${esc(p.entrada.data||'')}"></div><div class="fi"><label>CÓDIGO T</label><input data-e="t" value="${esc(p.entrada.t||'')}" placeholder="${nextT()}"></div><div class="fi"><label>RECEBIDO m</label><input data-e="m" value="${p.entrada.m??''}"></div><div class="fi"><label>RECEBIDO kg</label><input data-e="kg" value="${p.entrada.kg??''}"></div><div class="fi"><label>INSPEÇÃO</label><select data-e="insp">${['OK','COM RESSALVA','REPROVADO'].map(o=>`<option ${p.entrada.insp===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
    <p class="help">${rec?'Entrada confirmada — o tecido '+p.entrada.t+' já está no ESTOQUE. Editar aqui não altera o estoque.':'Ao confirmar: cria o tecido no ESTOQUE com o código T, foto, cores e metragem recebida.'}</p></div>
  <div class="sec"><button class="tb red" id="bDelP">EXCLUIR PEDIDO</button></div>`,
  `<button class="tb" id="bCancel">CANCELAR</button><button class="tb" id="bSaveP">SALVAR</button>${rec?'':'<button class="tb ok" id="bConf">CONFIRMAR ENTRADA</button>'}`);
  $('#bCancel').onclick=closeMod; $('#bSaveP').onclick=()=>savePed(false); const bc=$('#bConf'); if(bc) bc.onclick=confirmPed;
  $('#pFoto').onclick=()=>pickPhoto(d=>{cur.foto=d;$('#pPh').innerHTML=`<img src="${d}">`;$('#bRead').disabled=false;},1400);
  $('#bRead').onclick=lerComClaude; $('#bPaste').onclick=colarLeitura; $('#bCrop').onclick=async()=>{readPed(true); if(!cur.cores.some(c=>c.box&&!c.thumb)){ toast('Sem posições da leitura — toque na 1ª coluna da cor p/ recortar à mão',5000); return; } await autoCropAll(); };
  $$('#corBody .swc').forEach(td=>td.onclick=()=>{ if(!cur.foto){ toast('Carregue a foto do pedido primeiro'); return; } readPed(true); openCrop(+td.dataset.sw); }); $('#bKey').onclick=setApiKey;
  $('#bAddComp').onclick=()=>{readPed(true);cur.comp.push({pct:null,fibra:''});drawPed();};
  $('#bAddCor').onclick=()=>{readPed(true);cur.cores.push({cor:'',qtd:null,rolosPrev:null});drawPed();};
  $('#bDelP').onclick=async()=>{ if(!confirm('Excluir este pedido?')) return; await FB.deleteDoc(FB.doc(FB.db,'pedidos',cur.id)); closeMod(); toast('Pedido excluído'); };
}
function readPed(keep){ $$('#tmBody [data-k]').forEach(i=>{ const k=i.dataset.k; let v=i.value.trim(); if(['gram','larg','preco'].includes(k)) v=tnum(v); else if(['data','prazo'].includes(k)) v=brToISO(v); cur[k]=v; });
  $$('#tmBody [data-e]').forEach(i=>{ const k=i.dataset.e; let v=i.value.trim(); if(['m','kg'].includes(k)) v=tnum(v); else if(k==='data') v=brToISO(v); else if(k==='t') v=v.toUpperCase(); cur.entrada[k]=v; });
  $$('#compBody input').forEach(i=>{ const c=cur.comp[+i.dataset.comp]; if(!c) return; c[i.dataset.f]=i.dataset.f==='pct'?tnum(i.value):i.value.trim().toUpperCase(); }); if(!keep) cur.comp=cur.comp.filter(c=>c.fibra||c.pct!=null);
  $$('#corBody input[data-cor]').forEach(i=>{ const c=cur.cores[+i.dataset.cor]; if(!c) return; c[i.dataset.f]=i.dataset.f==='cor'?i.value.trim().toUpperCase():tnum(i.value); });
  const rol={}; $$('#corBody input[data-rol]').forEach(i=>{ const v=tnum(i.value); if(v!=null) rol[i.dataset.rol]=v; }); cur.entrada.rolos=rol; if(!keep) cur.cores=cur.cores.filter(c=>c.cor||c.qtd!=null); }
async function savePed(silent){ readPed(); const p={...cur}; delete p._try; p.atualizado=new Date().toISOString(); p.por=by(); try{ await FB.setDoc(FB.doc(FB.db,'pedidos',p.id),p); if(!silent){ const n=pendencias(p).ped.length; toast(n?`Salvo · ⚠ ${n} campo(s) por preencher`:'Pedido salvo'); closeMod(); } }catch(e){ toast('Erro: '+e.code,5000); } }
async function confirmPed(){ readPed(); const {ent}=pendencias(cur); if(ent.length){ cur._try=true; toast('Falta p/ confirmar: '+ent.join(', '),5000); return; }
  const e=cur.entrada; if(!e.t) e.t=nextT(); e.t=e.t.toUpperCase(); if(TDOCS.find(t=>t.code===e.t)){ toast(e.t+' já existe no estoque — informe outro código T'); return; }
  const gram=tnum(cur.gram),larg=tnum(cur.larg),preco=tnum(cur.preco); const rend=gram&&larg?1000/(gram*larg):null; const precoM=preco==null?null:(cur.unid==='kg'?(rend?preco/rend:null):preco);
  const m=tnum(e.m)!=null?tnum(e.m):(rend&&tnum(e.kg)!=null?Math.round(tnum(e.kg)*rend*10)/10:0);
  const t={code:e.t,nome:cur.nome||'',forn:cur.fornecedor||'',nf:e.nf||'',estoque:m,usado:0,status:m>0?'estoque':'esgotado',comp:cur.comp.filter(c=>c.fibra).map(c=>(c.pct!=null?c.pct+'% ':'')+c.fibra).join(' / '),estacao:'',preco:precoM,largura:larg,gramatura:gram,dataEntrada:e.data,cores:cur.cores.filter(c=>c.cor).map((c,i)=>({cor:c.cor,entrada:tnum(c.qtd)||0,saldo:tnum(c.qtd)||0,rolos:e.rolos[i]||null,thumb:c.thumb||null,hex:c.hex||null})),foto:cur.foto||null,obs:cur.obs||'',pedidoId:cur.id,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:by()};
  cur.status='RECEBIDO';
  try{ const b=FB.writeBatch(FB.db); b.set(FB.doc(FB.db,'tecidos',t.code),t); const p={...cur}; delete p._try; p.atualizado=t.updatedAt; p.por=by(); b.set(FB.doc(FB.db,'pedidos',p.id),p); b.set(FB.doc(FB.db,'movs','M'+Date.now().toString(36)),{id:'M'+Date.now().toString(36),code:t.code,delta:m,antes:0,depois:m,motivo:'entrada NF '+(e.nf||'?')+' · pedido '+(cur.fornecedor||''),at:t.updatedAt,by:by()}); await b.commit(); toast(`Entrada confirmada → ${t.code} criado no ESTOQUE`,4000); closeMod(); }catch(err){ toast('Erro: '+err.code,5000); } }

/* ---------- import / export ---------- */
function exportJson(){ const blob=new Blob([JSON.stringify({exportado:new Date().toISOString(),tecidos:TDOCS,pedidos:PED})],{type:'application/json'}); dl(blob,'tecidos_backup_'+todayISO()+'.json'); }
async function exportXlsx(){ toast('Gerando…'); const X=await import('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mjs').catch(()=>null); if(!X){ toast('Sem internet p/ baixar o gerador de xlsx'); return; }
  const H=['T','NOME','FORNECEDOR','NF','ESTOQUE m','USADO m','STATUS','COMPOSIÇÃO','ESTAÇÃO','PREÇO/m','LARGURA','GRAMATURA','ENTRADA','CORES','ATUALIZADO','POR'];
  const rows=TDOCS.slice().sort((a,b)=>codeNum(a.code)-codeNum(b.code)).map(t=>[t.code,t.nome,t.forn,t.nf,t.estoque,t.usado||0,t.status,t.comp,t.estacao,t.preco,t.largura,t.gramatura,dtBR(t.dataEntrada),(t.cores||[]).map(c=>c.cor+(c.saldo!=null?' '+c.saldo+'m':'')).join(' / '),dtBR(t.updatedAt),t.updatedBy||'']);
  const cores=[['T','COR','ENTRADA m','SALDO m']]; TDOCS.forEach(t=>(t.cores||[]).forEach(c=>cores.push([t.code,c.cor,c.entrada,c.saldo])));
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([H,...rows]),'TECIDOS'); X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(cores),'CORES');
  const ped=[['ID','STATUS','DATA','FORNECEDOR','NOME','UNID','QTD','PREÇO','PRAZO','NF','T','ENTRADA']]; PED.forEach(p=>ped.push([p.id,p.status,dtBR(p.data),p.fornecedor,p.nome,p.unid,totalM(p),p.preco,dtBR(p.prazo),p.entrada?.nf||'',p.entrada?.t||'',dtBR(p.entrada?.data)])); X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(ped),'PEDIDOS');
  const out=X.write(wb,{bookType:'xlsx',type:'array'}); dl(new Blob([out]),'TECIDOS_'+todayISO()+'.xlsx'); }
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }

function bindPed(){ const bk=$('#bKey'); if(bk) bk.onclick=setApiKey; $$('.pc').forEach(el=>el.onclick=()=>openPed(PED.find(p=>p.id===el.dataset.id))); $$('[data-pf]').forEach(b=>b.onclick=()=>{PFILT=b.dataset.pf;render()}); const np=$('#bNewP'); if(np) np.onclick=()=>openPed(blankPed()); }
function openTecNew(){ openTec({code:nextT(),nome:'',forn:'',nf:'',estoque:0,usado:0,status:'estoque',comp:'',estacao:'',preco:null,largura:null,gramatura:null,dataEntrada:todayISO(),cores:[],foto:null,obs:'',novo:true}); }
function openTecEdit(code){ const t=TDOCS.find(x=>x.code===code); if(t) openTec(t); else toast('Tecido não encontrado na nuvem'); }
async function cloudImportEstoque(items,fname){
  let novos=0,atual=0,ig=0; const now=new Date().toISOString(); let batch=FB.writeBatch(FB.db),n=0;
  for(const it of items){ const ex=TDOCS.find(t=>t.code===it.code);
    const d={code:it.code,nome:it.nome||'',forn:it.forn||'',nf:it.nf||'',estoque:it.estoque||0,usado:it.usado||0,status:it.status,comp:it.comp||'',estacao:it.estacao||'',preco:it.preco??null,largura:it.largura??null,gramatura:it.gramatura??null,mediaRolo:it.mediaRolo??null,dataEntrada:it.dataEntrada||'',cores:(it.cores||[]).map(c=>({cor:c.cor,entrada:c.entrada,saldo:c.saldo,pct:c.pct,data:c.data||null})),foto:it.foto||null,obs:'',fonte:fname,updatedAt:now,updatedBy:by()};
    if(!ex){ d.createdAt=now; batch.set(FB.doc(FB.db,'tecidos',d.code),d); novos++; }
    else if(!ex.updatedBy||ex.fonte){ if(!d.foto&&ex.foto) d.foto=ex.foto; d.createdAt=ex.createdAt||now; d.obs=ex.obs||''; batch.set(FB.doc(FB.db,'tecidos',d.code),d); atual++; }
    else ig++;
    if(++n%40===0){ await batch.commit(); batch=FB.writeBatch(FB.db); } }
  await batch.commit(); return {novos,atual,ig};
}

/* ---------- Claude lê a foto do pedido ---------- */
const PROMPT_PED=`Você lê pedidos de compra de TECIDO escritos à mão em formulários de fornecedores brasileiros (IMATEX, GRIFE TÊXTIL, DIAGONAL etc.) para uma confecção de moda feminina. Extraia os dados da foto e responda SOMENTE com JSON válido, sem markdown, neste formato:
{"data":"dd/mm/aa ou vazio","fornecedor":"nome do fornecedor (cabeçalho impresso)","vendedor":"","pagto":"ex. 80/90/100","prazo":"PE ou data","numforn":"nº proposta/pedido impresso","quem":"assinatura/quem fechou","codigo":"código do artigo","nome":"nome do tecido em MAIÚSCULAS","composicao":[{"pct":87,"fibra":"VISCOSE"}],"gram":"gramatura g/m² ou vazio","larg":"largura em m ou vazio","unid":"m ou kg","preco":"preço unitário só número, vírgula decimal","tipo":"LISO ou ESTAMPADO","cores":[{"cor":"nome ou nº da cor como escrito","qtd":"quantidade só número","descricao":"cor vista na amostra, em pt-BR","box":[35,20,12,8]}],"obs":"observações","unsure":["lista de chaves em que você NÃO teve certeza"]}
Sobre "box": posição APROXIMADA da amostra de tecido (swatch) daquela cor na foto, em PORCENTAGEM da imagem: [esquerda,topo,largura,altura], números 0-100. Cubra só o tecido, evitando fita e papel; se não houver amostra visível p/ a cor, omita "box".
Regras: mantenha os nomes das cores exatamente como escritos. Se algo estiver cortado ou ilegível, deixe vazio e inclua a chave em "unsure". Não invente valores.`;
async function setApiKey(){ const k=prompt('Chave da API Anthropic (sk-ant-…). Fica salva na nuvem, compartilhada com quem tem acesso ao ELO.',CFG.apiKey||''); if(k===null) return; try{ await FB.setDoc(FB.doc(FB.db,'config','cfg'),{...CFG,apiKey:k.trim(),apiKeyBy:by(),apiKeyAt:new Date().toISOString()}); toast(k.trim()?'Chave salva na nuvem':'Chave removida'); }catch(e){ toast('Erro: '+e.code); } }
async function lerComClaude(){ if(!cur||!cur.foto) return; if(!CFG.apiKey){ toast('Falta a chave da API — botão 🔑 CHAVE API na aba PEDIDOS',6000); return; }
  const b=$('#bRead'); b.disabled=true; b.textContent='⏳ LENDO…'; readPed(true);
  try{ const m=cur.foto.match(/^data:(image\/\w+);base64,(.+)$/);
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':CFG.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:m[1],data:m[2]}},{type:'text',text:PROMPT_PED}]}]})});
    if(!r.ok){ const t=await r.text(); throw new Error(r.status===401?'Chave da API inválida (🔑 CHAVE API)':'Erro '+r.status+': '+t.slice(0,140)); }
    const data=await r.json(); const txt=data.content.filter(x=>x.type==='text').map(x=>x.text).join(''); const j=JSON.parse(txt.replace(/\`\`\`json|\`\`\`/g,'').trim());
    applyRead(j); toast('Leitura aplicada · confira os campos marcados',5000);
  }catch(e){ console.error(e); toast('Não consegui ler: '+(/Failed to fetch|NetworkError/i.test(e.message)?'sem resposta da API (internet? chave?)':e.message),7000); const bb=$('#bRead'); if(bb){ bb.disabled=false; bb.textContent='🤖 LER COM CLAUDE'; } } }
function colarLeitura(){ const t=prompt('Cole aqui o JSON gerado pelo Claude (alternativa sem chave):',''); if(!t) return; try{ readPed(true); applyRead(JSON.parse(t.replace(/\`\`\`json|\`\`\`/g,'').trim())); toast('Leitura aplicada'); }catch(e){ toast('JSON inválido — cole o bloco inteiro',4500); } }
function applyRead(j){ const s=k=>j[k]==null?'':String(j[k]).trim();
  ['fornecedor','vendedor','pagto','numforn','quem','codigo','nome','obs'].forEach(k=>{ if(s(k)) cur[k]=s(k); });
  ['gram','larg','preco'].forEach(k=>{ if(s(k)) cur[k]=tnum(s(k)); });
  if(s('data')) cur.data=brToISO(s('data')); if(s('prazo')&&/\d/.test(s('prazo'))) cur.prazo=brToISO(s('prazo'));
  if(/kg/i.test(s('unid'))) cur.unid='kg'; if(/ESTAMP/i.test(s('tipo'))) cur.tipo='ESTAMPADO';
  if(Array.isArray(j.composicao)&&j.composicao.length) cur.comp=j.composicao.map(c=>({pct:tnum(String(c.pct??'').replace('%','')),fibra:String(c.fibra??'').toUpperCase()}));
  if(Array.isArray(j.cores)&&j.cores.length) cur.cores=j.cores.map(c=>({cor:String(c.cor??'').toUpperCase(),qtd:tnum(String(c.qtd??'')),rolosPrev:null,obs:String(c.descricao??''),thumb:null,hex:null,box:Array.isArray(c.box)&&c.box.length===4?c.box.map(Number):null}));
  cur.unsure=Array.isArray(j.unsure)?j.unsure:[];
  const forn=[...new Set([...DEF_FORN,...TDOCS.map(t=>t.forn).filter(Boolean)])].find(f=>cur.fornecedor&&f.replace(/\s|TEXTIL|TÊXTIL/gi,'').startsWith(cur.fornecedor.replace(/\s|TEXTIL|TÊXTIL/gi,'').slice(0,4).toUpperCase())); if(forn) cur.fornecedor=forn;
  cur._try=true; drawPed(); autoCropAll(); }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function cropFromImage(img,sx,sy,sw,sh){ const c=document.createElement('canvas'); c.width=160; c.height=150; const ctx=c.getContext('2d'); ctx.drawImage(img,sx,sy,sw,sh,0,0,160,150);
  const d=ctx.getImageData(0,0,160,150).data; let r=0,g=0,b=0,n=0; for(let i=0;i<d.length;i+=16){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
  return {thumb:c.toDataURL('image/jpeg',.85),hex:'#'+[r,g,b].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('').toUpperCase()}; }
async function autoCropAll(){ if(!cur||!cur.foto) return; if(!cur.cores.some(c=>c.box&&!c.thumb)) return;
  try{ const img=await loadImg(cur.foto); let n=0;
    for(const c of cur.cores){ if(!c.box||c.thumb) continue; let [bx,by_,bw,bh]=c.box.map(v=>Math.max(0,Math.min(100,+v||0))); if(bw<2||bh<2) continue;
      const inx=bw*0.12,iny=bh*0.12; bx+=inx; by_+=iny; bw-=2*inx; bh-=2*iny;
      const r=cropFromImage(img,img.width*bx/100,img.height*by_/100,img.width*bw/100,img.height*bh/100); c.thumb=r.thumb; c.hex=r.hex; n++; }
    if(n){ drawPed(); toast(`Swatches recortados (${n})`,3500); }
  }catch(e){ console.error(e); } }
/* ---------- recorte manual de swatch ---------- */
let CROP={i:-1,img:null,sel:null,drag:null};
async function openCrop(i){ CROP.i=i; const c=cur.cores[i]; let box=document.getElementById('cropBox'); if(!box){ box=document.createElement('div'); box.id='cropBox'; document.body.appendChild(box); }
  box.innerHTML=`<div class="cb"><div class="cbh"><b>RECORTAR · ${esc(c.cor||'cor '+(i+1))}</b><span>arraste um retângulo sobre o tecido</span><button class="tb" id="cropCancel">CANCELAR</button><button class="tb ok" id="cropUse" disabled>USAR</button></div><div class="cbw"><img id="cropImg" src="${cur.foto}" draggable="false"><div id="cropSel"></div></div><div class="cbp"><canvas id="cropPv" width="160" height="150"></canvas><span class="sm" id="cropHex"></span></div></div>`;
  box.classList.add('on'); CROP.sel=null; CROP.img=await loadImg(cur.foto);
  const w=box.querySelector('.cbw'), sel=box.querySelector('#cropSel'), im=box.querySelector('#cropImg');
  const pos=e=>{ const r=im.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:Math.max(0,Math.min(r.width,p.clientX-r.left)),y:Math.max(0,Math.min(r.height,p.clientY-r.top)),W:r.width,H:r.height}; };
  const draw=()=>{ const s=CROP.sel; if(!s){ sel.style.display='none'; return; } sel.style.display='block'; sel.style.left=s.x+'px'; sel.style.top=s.y+'px'; sel.style.width=s.w+'px'; sel.style.height=s.h+'px'; };
  const down=e=>{ e.preventDefault(); const p=pos(e); CROP.drag={x:p.x,y:p.y,W:p.W,H:p.H}; CROP.sel={x:p.x,y:p.y,w:0,h:0}; draw(); };
  const move=e=>{ if(!CROP.drag) return; e.preventDefault(); const p=pos(e); const d=CROP.drag; CROP.sel={x:Math.min(d.x,p.x),y:Math.min(d.y,p.y),w:Math.abs(p.x-d.x),h:Math.abs(p.y-d.y)}; draw(); };
  const up=e=>{ if(!CROP.drag) return; const d=CROP.drag; CROP.drag=null; const s=CROP.sel; if(!s||s.w<6||s.h<6){ CROP.sel=null; draw(); return; }
    const kx=CROP.img.width/d.W, ky=CROP.img.height/d.H; const r=cropFromImage(CROP.img,s.x*kx,s.y*ky,s.w*kx,s.h*ky); CROP.res=r;
    const cv=box.querySelector('#cropPv'); const ctx=cv.getContext('2d'); const ii=new Image(); ii.onload=()=>ctx.drawImage(ii,0,0,160,150); ii.src=r.thumb; box.querySelector('#cropHex').textContent=r.hex; box.querySelector('#cropUse').disabled=false; };
  w.onmousedown=down; w.onmousemove=move; w.onmouseup=up; w.onmouseleave=up; w.ontouchstart=down; w.ontouchmove=move; w.ontouchend=up;
  box.querySelector('#cropCancel').onclick=()=>{ box.classList.remove('on'); };
  box.querySelector('#cropUse').onclick=()=>{ if(!CROP.res) return; const cc=cur.cores[CROP.i]; cc.thumb=CROP.res.thumb; cc.hex=CROP.res.hex; cc.box=null; box.classList.remove('on'); drawPed(); toast('Swatch recortado · salve o pedido'); };
}

async function boot(){
  if(META&&META.snapshot){ /* arquivo recebido por WhatsApp: mostra exatamente o que foi exportado */
    DEB=SEED_DEB; ROB=SEED_ROB; TEC=SEED_TEC; if(typeof SEED_TODO!=='undefined') TODO=Object.assign({done:{},extra:[]},SEED_TODO); $('#gate').hidden=true;
  } else {
    const ui=await dbGet('ui'); if(ui) UI=Object.assign({rob:{},deb:{},fg:{},fgAll:false,kanban:false},ui);
    $('#gIn').onclick=()=>window.FB?window.FB.login():toast('Sem conexão com o Firebase — verifique a internet'); $('#outBtn').onclick=()=>window.FB.signOut();
  }
  $('#expBtn').onclick=exportSnapshot;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{VIEW=t.dataset.v; render();});
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{FILTER=(FILTER===c.dataset.f?'':c.dataset.f); if(FILTER&&VIEW==='roberto') VIEW='lista'; render();});
  $('#q').oninput=e=>{Q=e.target.value.trim(); if(Q&&VIEW==='roberto') VIEW='lista'; render();};
  $('#fileIn').onchange=e=>importFiles(e.target.files);
  $('#upBtn').onclick=()=>$('#fileIn').click();
  $('#mpClose').onclick=closeModel; document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModel(); });
  let dragN=0; const drop=$('#drop');
  window.addEventListener('dragenter',e=>{e.preventDefault(); dragN++; drop.classList.add('on');});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('dragleave',()=>{ if(--dragN<=0){dragN=0; drop.classList.remove('on');} });
  window.addEventListener('drop',e=>{e.preventDefault(); dragN=0; drop.classList.remove('on'); importFiles(e.dataTransfer.files);});
  render();
}
document.addEventListener('DOMContentLoaded',boot);
