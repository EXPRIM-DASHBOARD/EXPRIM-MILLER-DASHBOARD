<style>
:root{--bg:#0B1322;--card:#101B2E;--line:#1E2C45;--ink:#E8E6DF;--ink2:#8FA1BC;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif;padding:12px 12px 20px}
h1{font-size:15px;color:var(--gold);margin:0}
.sub{font-size:11.5px;color:var(--ink2)}
.mock{display:inline-block;border:1px solid var(--orange);color:var(--orange);border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800}
.top{display:flex;gap:6px;margin:10px 0}
.tcard{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 4px;font-weight:800;font-size:13px;color:var(--ink2);background:var(--card);position:relative}
.tcard.on{color:var(--gold);border-color:var(--gold)}
.badge{position:absolute;top:-7px;right:-4px;background:var(--orange);color:#0B1322;border-radius:9px;font-size:10px;font-weight:900;padding:1px 6px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chip{flex:1;min-width:17%;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:9px 2px;font-weight:800;font-size:11.5px;color:var(--ink2);background:var(--card)}
.chip.on{color:#0B1322;border-color:transparent}
.chip.P.on{background:#3FB68B}.chip.PROM.on{background:#E8A33D}.chip.PPED.on{background:#D4AF37}
.chip.SAL.on{background:#F0705A}.chip.EST.on{background:#8FA1BC}
input[type=search],textarea{width:100%;padding:12px 13px;border:1.5px solid var(--gold);border-radius:12px;background:var(--cream);color:var(--ink);font-size:17px;font-weight:800}
textarea{font-size:10px;font-weight:400;color:var(--ink2);height:130px;border-color:var(--line)}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin:6px 0}
.row .m{font-weight:800;font-size:15px;color:var(--gold);min-width:80px}
.row .i{flex:1;font-size:10.5px;color:var(--ink2)}
.sz{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:9.5px;font-weight:800;margin-right:3px;color:var(--blue);border-color:var(--blue)}
.lb{display:inline-block;border-radius:6px;padding:0 6px;font-size:9.5px;font-weight:900;margin-left:4px}
.lb.mov{background:#3A2E12;color:var(--orange)}
.lb.draft{background:#20283A;color:var(--ink)}
.lb.sent{background:#3A3212;color:#F2C94C}
.lb.ok{background:#12352A;color:var(--green)}
.lb.nao{background:#3A1515;color:var(--red)}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 12px;font-weight:800;font-size:13px}
.btn.g{border-color:var(--green);color:var(--green)}.btn.o{border-color:var(--orange);color:var(--orange)}
.btn.b{border-color:var(--blue);color:var(--blue)}.btn.r{border-color:var(--red);color:var(--red)}
.note{font-size:11px;color:var(--ink2);margin-top:6px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;padding:14px;display:none;z-index:50}
#sheet .m2{font-size:19px;font-weight:900;color:var(--gold)}
#sheet .acts{display:flex;gap:8px;margin-top:12px}
#sheet .acts .btn{flex:1;text-align:center;padding:14px 4px;font-size:14px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1A2438;border:1.5px solid var(--gold);border-radius:11px;padding:10px 16px;font-size:13px;display:none;z-index:99;max-width:92%;text-align:center}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}
</style></head><body>

 if(!(n>0)){toast('⚠ Valor inválido');return;}
 S.prc[m]={de:x.z||null,para:n,st:'draft'};save();closeSheet();render();
 toast('🏷 <b>'+m+'</b>: proposta '+fmtP(n)+' (⚪ rascunho — fica 🟡 quando enviar)');}
function contar(m){const x=byM(m);
 const v=prompt('Quantas peças de '+m+' você contou?\n(sistema: '+x.e+' pçs)','');
 if(v===null)return;const q=parseInt(String(v).replace(/\D/g,''),10);
 if(isNaN(q)){toast('⚠ Digite um número');return;}
 S.bal[m]=q;save();closeSheet();render();
 toast('🔢 <b>'+m+'</b>: '+q+' pçs'+(q===x.e?' — bate 👌':' (sistema '+x.e+')'));}
function etiqueta(m){const x=byM(m);
 const v=prompt('Preço da ETIQUETA real de '+m+'\n(sistema: '+(x.z?fmtP(x.z):'—')+')','');
 if(v===null)return;const n=parseFloat(String(v).replace(',','.'));
 if(!(n>0)){toast('⚠ Valor inválido');return;}
 S.tag[m]=n;save();closeSheet();render();
 toast('🏷 <b>'+m+'</b>: etiqueta '+fmtP(n)+(x.z&&Math.abs(n-x.z)<0.005?' — bate 👌':''));}
function limpar(m){delete S.mov[m];delete S.prc[m];delete S.bal[m];delete S.tag[m];save();closeSheet();render();toast(m+' — registros removidos');}
function enviar(){Object.values(S.prc).forEach(p=>{if(p.st==='draft')p.st='sent';});save();
 const t=document.getElementById('out');
 if(navigator.share){navigator.share({text:t.value}).then(()=>toast('✔ Enviado — propostas agora 🟡'))
  .catch(e=>{if(e&&e.name==='AbortError')return;copia();});}
 else copia();
 render();}
function copia(){const t=document.getElementById('out');if(!t)return;
 t.removeAttribute('readonly');t.focus();t.select();try{t.setSelectionRange(0,t.value.length);}catch(e){}
 let ok=false;try{ok=document.execCommand('copy');}catch(e){}
 t.setAttribute('readonly','');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value)
  .then(()=>toast('✔ Copiado — mande no WhatsApp')).catch(()=>toast(ok?'✔ Copiado':'⚠ Não copiou — segure no texto e copie'));
 else toast(ok?'✔ Copiado':'⚠ Não copiou');}
function aplicar(){const t=document.getElementById('resp').value||'';let ok=0,nao=0;
 t.split(/\n+/).forEach(l=>{const p=l.trim().split('|');
  if(p[0]==='OK'&&S.prc[p[1]]){S.prc[p[1]].st='ok';ok++;}
  if(p[0]==='NAO'&&S.prc[p[1]]){S.prc[p[1]].st='nao';nao++;}});
 save();render();
 toast(ok+nao?('✔ Aplicado: 🟢 '+ok+' confirmados'+(nao?' · 🔴 '+nao+' não aprovados':'')):'⚠ Nenhuma linha OK|/NAO| reconhecida');}
if(TASK){const c=document.getElementById('c_tk');c.style.display='';const b=document.getElementById('ntk');b.style.display='';b.textContent=TASK.ms.length;}
document.getElementById('dt').textContent=new Date().toLocaleDateString('pt-BR');
render();
</script></body></html>
